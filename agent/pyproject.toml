[project]
name = "lazyagent"
version = "0.1.0"
description = "LazyWallet voice AI agent (Claude Agent SDK)"
requires-python = ">=3.12"
dependencies = [
  "claude-agent-sdk>=0.2.166",
  "fastapi>=0.143",
  "uvicorn[standard]>=0.54",
  "web3>=8.0",
  "python-dotenv>=1.2",
]

[project.scripts]
agent = "lazyagent.server:main"
executor = "lazyagent.executor:main"

[dependency-groups]
dev = ["pytest>=9.1", "pytest-asyncio>=1.4", "httpx2>=2.13"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lazyagent"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
